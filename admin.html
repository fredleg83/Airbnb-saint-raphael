<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Administration Airbnb Saint‑Raphaël</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eef6fb;color:#173b60}
.wrap{max-width:760px;margin:auto;padding:22px}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 12px 38px rgba(18,55,88,.15)}
h1{margin-top:0;color:#0b376b;font-size:30px}
label{display:block;font-weight:800;margin:16px 0 7px}
input,textarea{box-sizing:border-box;width:100%;font:inherit;padding:13px 14px;border:1px solid #c8d9e7;border-radius:12px;background:#fbfdff}
textarea{min-height:100px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{width:100%;margin-top:22px;border:0;border-radius:14px;background:#0b78d1;color:#fff;padding:15px;font-size:18px;font-weight:800}
button:disabled{opacity:.55}
.status{margin-top:14px;padding:12px;border-radius:12px;background:#f3f7fa;line-height:1.45}
.note{font-size:14px;color:#5e7489;line-height:1.45}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🏠 Écran Airbnb — Administration</h1>
<label>Code secret</label><input id="secret" type="password" placeholder="Votre code secret">
<label>Nom du ou des voyageurs</label><input id="guestName">
<label>Message de bienvenue</label><textarea id="welcomeMessage">Profitez pleinement de votre séjour ! ♡</textarea>
<div class="grid">
<div><label>Date d’arrivée</label><input id="stayStart" type="date"></div>
<div><label>Date de départ</label><input id="stayEnd" type="date"></div>
</div>
<div class="grid">
<div><label>Heure d’arrivée</label><input id="arrivalTime" type="time" value="15:00"></div>
<div><label>Heure de départ</label><input id="departureTime" type="time" value="11:00"></div>
</div>
<label>Message exceptionnel</label><textarea id="customNotice"></textarea>
<button id="saveBtn">Enregistrer sur l’écran</button>
<div id="status" class="status">Chargement…</div>
<p class="note">L’écran principal vérifie les nouvelles informations toutes les 30 secondes.</p>
</div></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxhRP1wgzlB8Rw0aaHiHAJW--nHHx6EUbI1oGmugSIewVl5q42-APeA3cMg9sUVw2rn/exec";
const fields = ["guestName","welcomeMessage","stayStart","stayEnd","arrivalTime","departureTime","customNotice"];
let node = null;

function jsonp(params, cb, onError) {
  if (node) node.remove();
  const q = new URLSearchParams(params);
  q.set("callback", cb);
  q.set("t", Date.now());
  node = document.createElement("script");
  node.src = API_URL + "?" + q.toString();
  node.onerror = onError || function(){};
  document.head.appendChild(node);
}

window.__loadAdmin = function(data) {
  fields.forEach(id => {
    if (Object.prototype.hasOwnProperty.call(data,id)) document.getElementById(id).value = data[id] || "";
  });
  document.getElementById("status").textContent = "✅ Informations chargées.";
  if (node) { node.remove(); node = null; }
};

window.__saveAdmin = function(data) {
  document.getElementById("saveBtn").disabled = false;
  if (node) { node.remove(); node = null; }
  document.getElementById("status").textContent =
    data && data.ok ? "✅ Enregistré et confirmé. L’écran principal se mettra à jour sous 30 secondes."
                    : "❌ " + ((data && data.error) || "Échec de l’enregistrement.");
};

jsonp({action:"get"}, "__loadAdmin", function(){
  document.getElementById("status").textContent = "⚠️ Impossible de charger les données.";
});

document.getElementById("saveBtn").addEventListener("click", function() {
  const secret = document.getElementById("secret").value.trim();
  if (!secret) {
    document.getElementById("status").textContent = "⚠️ Saisis le code secret.";
    return;
  }
  this.disabled = true;
  document.getElementById("status").textContent = "Enregistrement…";
  const params = {action:"set", secret};
  fields.forEach(id => params[id] = document.getElementById(id).value);
  jsonp(params, "__saveAdmin", function(){
    document.getElementById("saveBtn").disabled = false;
    document.getElementById("status").textContent = "❌ Impossible de joindre Apps Script.";
  });
});
</script>
</body></html>
